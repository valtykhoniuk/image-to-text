<section class="ocr">
  <h1>Image to Text</h1>
  <p class="hint">Upload a JPEG or PNG image up to 2 MB.</p>

  <label class="file-label">
    Choose image
    <input
      type="file"
      accept=".jpeg,.jpg,.png,image/jpeg,image/png"
      (change)="onFileSelected($event)"
    />
  </label>

  @if (selectedFile) {
    <p class="file-name">Selected: {{ selectedFile.name }}</p>
  }

  @if (previewUrl) {
    <img [src]="previewUrl" alt="Selected image preview" class="preview" />
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <button
    type="button"
    class="btn"
    [disabled]="!selectedFile || isLoading"
    (click)="extractText()"
  >
    {{ isLoading ? 'Extracting...' : 'Extract text' }}
  </button>

  @if (extractedText) {
    <div class="result">
      <div class="result-header">
        <h2>Extracted text</h2>
        <button type="button" class="btn btn-secondary" (click)="copyText()">
          {{ copyLabel }}
        </button>
      </div>
      <p class="result-text">{{ extractedText }}</p>
    </div>
  }
</section>
