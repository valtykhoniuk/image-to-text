<section>
  <p>Image to Text</p>
  <input
    type="file"
    name="image_input"
    accept=".jpeg, .jpg, .png"
    (change)="onFileSelected($event)"
  />

  @if (selectedFile) {
    <p>Selected: {{ selectedFile.name }}</p>
  }

  @if (previewUrl) {
    <img [src]="previewUrl" alt="Selected image preview" />
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <button type="button" [disabled]="!selectedFile || isLoading" (click)="extractText()">
    {{ isLoading ? 'Extracting...' : 'Extract text' }}
  </button>

  @if (extractedText) {
    <pre>{{ extractedText }}</pre>
  }
</section>
